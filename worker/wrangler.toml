name = "seguidores-cripto-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace para pedidos
# Crie com: wrangler kv namespace create ORDERS
# Cole o id retornado abaixo
[[kv_namespaces]]
binding = "ORDERS"
id = "COLE_O_ID_AQUI"
preview_id = "COLE_O_PREVIEW_ID_AQUI"

# Variáveis não-secretas
[vars]
WORKER_BASE_URL = "https://seguidores-cripto-worker.SEU-USUARIO.workers.dev"
SMM_API_URL     = "https://smmhub.com.br/api/v2"

# Segredos — configure via CLI (nunca coloque aqui):
# wrangler secret put DEPIX_API_KEY          ← token JWT DePix (prod)
# wrangler secret put NOWPAYMENTS_API_KEY    ← BTC / Lightning / USDT
# wrangler secret put NOWPAYMENTS_IPN_SECRET ← assinatura webhook NOWPayments
# wrangler secret put SMM_API_KEY            ← painel SMM (ex: SMMHub)
